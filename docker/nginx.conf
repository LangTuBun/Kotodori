server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (present on any Compose-created network) --
    # resolving "voicevox" through this, inside the location block below,
    # defers the lookup to request time instead of nginx startup/reload
    # time. That's what lets the voicevox service in docker-compose.yml be
    # optional: if it's absent, still starting up, or removed later, nginx
    # itself starts and serves the app fine regardless -- only a request to
    # /voicevox/ fails (502), which src/lib/speech.ts already treats as
    # "fall back to the browser voice". A plain `proxy_pass
    # http://voicevox:50021/` (resolved once at startup) would instead
    # refuse to start nginx at all -- breaking the entire app -- the moment
    # that hostname doesn't exist.
    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/manifest+json image/svg+xml;

    # Proxies to the optional VOICEVOX engine sidecar (see docker-compose.yml)
    # for real Japanese speech synthesis -- the browser only ever calls this
    # same-origin path (never the container directly). $voicevox_upstream +
    # the resolver above is what makes the hostname lookup happen per-request
    # rather than at startup; see the comment on `resolver` for why that
    # matters.
    location /voicevox/ {
        # set MUST come before rewrite ... break below -- both belong to the
        # rewrite module, and `break` stops *all further directives of that
        # module* in this location, a `set` included. Placed after `break`
        # (an earlier version of this file did this), $voicevox_upstream
        # would silently stay unset for every request, and proxy_pass below
        # would try to proxy to an empty host -- nginx -t still reports the
        # config as valid, since this only shows up at request time, so
        # there's no startup signal that it's broken.
        set $voicevox_upstream voicevox:50021;
        # proxy_pass normally strips a location's prefix on its own, but only
        # when its target is a literal URL known at config-load time -- with
        # a variable in the target (required for the request-time DNS lookup
        # above), nginx can't do that automatically and instead forwards the
        # *entire* original path unchanged, which would ask the engine for
        # e.g. /voicevox/audio_query (404) instead of /audio_query. The
        # rewrite strips the prefix explicitly before proxy_pass, which here
        # has no path of its own; `break` stops nginx from re-checking this
        # rewritten URI against the server's other locations, and the query
        # string (?speaker=...&text=...) is preserved automatically.
        rewrite ^/voicevox/(.*)$ /$1 break;
        proxy_pass http://$voicevox_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The engine's default CORS policy ("localapps") allows only a
        # handful of local origins, OR a request with no Origin header at
        # all -- browsers attach Origin to same-origin POSTs too, and nginx
        # would otherwise forward the app's real origin straight through,
        # getting every audio_query/synthesis call rejected. Blanking it here
        # makes the proxied request look like the no-Origin case the engine
        # already allows, with no CORS flag needed on the engine's own side.
        proxy_set_header Origin "";
        # Synthesis is real CPU work -- a couple seconds on a modest host
        # under load, well within this. The frontend's own fetch gives up
        # sooner than this (see VOICEVOX_SYNTHESIS_TIMEOUT_MS in
        # src/lib/speech.ts) and falls back to the browser voice, so this
        # timeout mainly matters for requests nginx is still holding open
        # after the browser itself has already moved on.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Hashed build assets (js/css from Vite's rollup output) -- filenames
    # change on every rebuild, so it's safe to cache these forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Icons/manifest have stable filenames (no content hash), so cache them
    # modestly rather than forever -- a changed icon should still show up
    # within a day, not need a hard refresh.
    location ~* \.(?:png|svg|webmanifest|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Everything else is a React Router route, not a real file -- fall back
    # to index.html and let the client-side router take over. Never cache
    # index.html itself, so a redeploy is picked up on next load instead of
    # being stuck behind a stale cached shell referencing old asset hashes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
